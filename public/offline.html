<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline · ERP Construction</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; font-family: system-ui, sans-serif; background: #F3F5F7; color: #161B22; }
      main { max-width: 28rem; background: #FFFFFF; border: 1px solid #DCE1E6; border-radius: 12px; padding: 24px; }
      h1 { font-size: 1.25rem; margin: 0 0 12px; }
      p { margin: 0 0 12px; color: #4A5563; }
      button { min-height: 44px; padding: 0 16px; border: 1px solid #5F6976; border-radius: 8px; background: #FFFFFF; color: #161B22; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>This page needs a connection. Anything you saved on this device is kept until you reconnect.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
