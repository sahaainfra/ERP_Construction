# Continuous integration (Part 02 REQ-ARCH-F17; Part 04 owns the pipeline).
# The quality job blocks. The design and security jobs are non-blocking until their conflicts are decided:
#   design-gate: CF-004 (four contrast pairings fail).
#   security-audit: R-02 (production advisories; fixes are major upgrades under ADR review).
name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Architecture boundaries and dependency allow-list (CP-ARCH-01, CP-ARCH-02)
        run: npm run arch:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit and characterisation tests
        run: npm test
      - name: Golden baseline (destructive changes fail)
        run: npm run baseline:check
      - name: Production build
        run: npm run build

  database:
    name: Database foundation (migrations, RLS, back-fill, idempotency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_migrator
          POSTGRES_PASSWORD: ci_only_migrator_password
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_migrator -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATOR_DATABASE_URL: postgres://erp_migrator:ci_only_migrator_password@localhost:5432/erp_test
      TEST_DATABASE_URL: postgres://erp_migrator:ci_only_migrator_password@localhost:5432/erp_test
      TEST_APP_DATABASE_URL: postgres://erp_app:ci_only_app_password@localhost:5432/erp_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create the application role (CI service superuser)
        run: |
          psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE erp_app LOGIN PASSWORD 'ci_only_app_password'"
      - name: Lint migrations (naming, destructive, float money, NOT NULL)
        run: npm run db:lint
      - name: Apply migrations to the empty database
        run: npm run db:migrate
      - name: Database tests (round trip, drift, RLS, idempotency, outbox, back-fill, integrity, masking)
        run: npx vitest run src/db/database.integration.test.ts

  design-gate:
    name: Design contrast gate (CF-004, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:design

  security-audit:
    name: Production dependency audit (R-02, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
